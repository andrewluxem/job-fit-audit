<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">job-fit-audit</title>
<desc id="d">Three panels. 1, a pasted job posting, drawn as gray lines, and the question Is this worth applying to? 2, the README's example verdict scored on the skill's rubric, seven dimensions, 1 to 5 each, 35 max: Scope 5, Level 4, Toolkit 5, Comp 4, Location 5, Referral 3, Freshness 5. 3, the example's verdict, APPLY NOW (Tier A, 31/35), Flags: none, and the rubric's tiers: A = 30+: APPLY NOW, B = 24 to 29: WORTH APPLYING, C = under 24: SKIP. Caption: It never invents anything.</desc>
<style>
