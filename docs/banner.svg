<g class="rh"><text x="456" y="189" class="sans" font-size="10.5" fill="#e4dfd4">Referral</text><rect x="516" y="181" width="9" height="9" rx="1.5" fill="#c8963e"/><rect x="528" y="181" width="9" height="9" rx="1.5" fill="#c8963e"/><rect x="540" y="181" width="9" height="9" rx="1.5" fill="#c8963e"/><rect x="552" y="181" width="9" height="9" rx="1.5" fill="none" stroke="#3d4248"/><rect x="564" y="181" width="9" height="9" rx="1.5" fill="none" stroke="#3d4248"/><text x="582" y="189" class="mono" font-size="10" fill="#e4dfd4">3</text></g>
